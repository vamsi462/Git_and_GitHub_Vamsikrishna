<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongoDB Assignment</title>
    <link rel="stylesheet" href="../static/style.css" />
  </head>
  <body>
    {% if error %}
    <p class="error-message">Error: {{ error }}</p>
    {% endif %}

    <form method="POST" action="/">
      <label>Enter information:</label>
      <input type="text" name="user_data" required />
      <button type="submit">Submit</button>
    </form>

    <form method="POST" action="/submittodoitem">
      <label>Item Name:</label>
      <input type="text" name="itemName" />

      <label>Item Description:</label>
      <input type="text" name="itemDescription" />

      <label>Item ID:</label>
      <input type="text" name="itemId" />

      <label>Item UUID:</label>
      <input type="text" name="itemUuid" />

      <label>Item Hash:</label>
      <input type="text" name="itemHash" />

      <button type="submit">Submit Item</button>
    </form>
  </body>
</html>
